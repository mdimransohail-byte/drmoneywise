<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr MoneyWise Article</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="site-body article-body">
    <div class="page-shell narrow-shell">
      <header class="topbar article-topbar">
        <a class="brand" href="/">
          <span class="brand-mark">DM</span>
          <span>
            <strong>Dr MoneyWise</strong>
            <small>Back to the newsroom</small>
          </span>
        </a>
        <div class="topbar-actions">
          <span id="articleMemberBadge" class="subtle-chip">Loading</span>
          <a class="button secondary" href="/">Home</a>
          <button id="articleSignOutButton" class="button secondary hidden" type="button">Sign out</button>
          <a class="button primary" href="/admin.html">Admin</a>
        </div>
      </header>

      <main>
        <article id="articleContainer" class="article-layout glass-card">
          <div class="loading-block">
            <div class="skeleton line"></div>
            <div class="skeleton line"></div>
            <div class="skeleton card"></div>
          </div>
        </article>
      </main>
    </div>

    <script type="module" src="/article.js"></script>
  </body>
</html>
